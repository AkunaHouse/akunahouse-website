<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfbf9;font-family:'DM Sans',Arial,sans-serif;color:#2b2f33}
a{color:#2f7680}a:hover{color:#1f5a62}
.w{max-width:1240px;margin:0 auto;padding-left:32px;padding-right:32px}
header{padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}

.tile{text-decoration:none;padding:56px 48px;display:flex;flex-direction:column;gap:14px}

.tile span{font-size:18px}
.t1{color:#fff;background:#2f7680}.t1 span{color:#d8ecee}.t1:hover{color:#fff;background:#286870}
.t2{color:#2b2f33;background:#fff;border:1px solid #d5dcdc}.t2 span{color:#5a6166}.t2:hover{color:#2b2f33;border-color:#2f7680}
footer{border-top:1px solid #e3e6e6}
footer .w{padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:15px;color:#5a6166}
footer a{color:#5a6166}
@media (max-width:700px){.tiles{grid-template-columns:1fr}.hero{padding-top:64px;padding-bottom:64px}.tile{padding:40px 28px}nav{gap:18px}}

</head>
